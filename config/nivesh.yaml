# Secrets are referenced by name only ("ref:NAME"); values come from env or the OS keychain.
mode: dev
data_dir: data
# Optional: set the Anthropic credential reference here (a ref: name, never a value).
ttls: {price: 1d, fundamentals: 7d, nav: 1d, mf_holdings: 31d, news: 6h, macro: 1d, filings: 7d, estimates: 1d, master: 7d}
# Example prices (USD per million tokens) and FX; replace with current figures. Used by the cost meter.
prices:
  claude-sonnet-example: {input_usd_per_mtok: 3.0, output_usd_per_mtok: 15.0}
usd_inr: 90.0
# registered_ip: 203.0.113.7   # egress IP registered with the broker (optional)
# backup: {target: /backups, recipient: age1..., retention_days: 30}
# HDFC InvestRight API app (secrets stay in the keychain; see docs/runbooks/investright.md).
# base_url is per spec, unverified against the live API.
investright:
  base_url: https://developer.hdfcsec.com
  redirect_port: 8765
  app_key: ref:INVESTRIGHT_API_KEY
  api_secret: ref:INVESTRIGHT_API_SECRET
  # demat_ref: <holder_ref printed by `nivesh ingest` for the demat linked to InvestRight>

# E3 US broker (read-only positions/account). Secrets stay in the keychain: `nivesh secrets set
# ALPACA_KEY` and `nivesh secrets set ALPACA_SECRET`. base_url is per spec, unverified.
us_broker:
  base_url: https://paper-api.alpaca.markets
  alpaca_key: ref:ALPACA_KEY
  alpaca_secret: ref:ALPACA_SECRET

# E3 tax parameter: owner-set, example only; Nivesh gives no tax advice. It only drives an
# informational long-term flag on US lots (days held >= this value). Unset means no flag.
tax:
  us_long_term_days: 365

# E4 market data. Secrets are refs; the EDGAR contact is read only from the secret EDGAR_CONTACT.
# Series ids, feed urls and wire formats are per spec, unverified against live sources.
market:
  edgar_max_per_sec: 8        # SEC allows 10
  fred_api_key: ref:FRED_API_KEY
  fmp_api_key: ref:FMP_API_KEY
  us_secondary: stooq         # stooq | none
  cross_check_tolerance: 0.01
  macro_series:               # role -> source/id (FRED ids unverified)
    policy_us: {source: fred, id: DFEDTARU}
    policy_in: {source: fred, id: INTDSRINM193N}
    y10_us: {source: fred, id: DGS10}
    y10_in: {source: fred, id: INDIRLTLT01STM}
    cpi_us: {source: fred, id: CPIAUCSL}
    cpi_in: {source: fred, id: INDCPIALLMINMEI}
    usdinr: {source: fred, id: DEXINUS}
    vix_us: {source: fred, id: VIXCLS}
    crude: {source: fred, id: DCOILBRENTEU}
    fii_net: {source: nse_flows, id: fii}
    dii_net: {source: nse_flows, id: dii}
  feeds:
    - {name: example-news, url: "https://example.invalid/feed.xml", kind: rss}
  # NSE holidays are gazette-announced, not computable. Owner must complete this list from the
  # NSE circular (lunar holidays are missing here); a year with no entry fails loudly.
  nse_holidays:
    2026: [2026-01-26, 2026-05-01, 2026-08-15, 2026-10-02, 2026-12-25]

# E5 mutual funds: owner-set parameters, example only (nothing here is advice). Wire formats of
# MFapi.in, AMFI NAVAll and the monthly-holdings source are per spec, unverified. The holdings
# source credential, if any, is a ref: name (`nivesh secrets set MFDATA_API_KEY`), never a value.
mf:
  sources: {nav_primary: mfapi, nav_fallback: amfi}
  holdings_source: fixture      # mfdata | amc | fixture
  holdings_api_ref: ref:MFDATA_API_KEY
  nav_gap_days: 5               # flag a run of more than this many missing weekdays
  nav_tolerance: 0.005          # cross-source NAV disagreement flag (fraction)
  mar_pct: 0                    # Sortino minimum acceptable return, annual percent
  consistency: {window_days: [1095, 1826], min_beat_pct: 50, min_median_excess_pct: 0}
  thresholds:
    ter_excess_pct: 0
    overlap_pct: 60
    downside_capture_max: 100
    max_drawdown_pct: 35
    min_tenure_years: 2
    valuation_stretch_ratio: 1.25
  benchmarks: {"Example Equity Index": "EXAMPLE INDEX"}   # fund benchmark text -> index symbol
  exit_load: {}                 # e.g. {"Equity: Large Cap": {percent: 1, days: 365}}
  tax: {}                       # long_term_days, short_rate_pct, long_rate_pct (unset: gain and days only)
  screen: {weights: {consistency: 1, downside: 1, cost: 1, valuation: 1}, universe: []}

# E6 analysis engines: owner-set parameters, example only and equal to the built-in defaults
# (nothing here is advice). Factor weights are versioned: weights_version is your label, and a
# digest of the weights is emitted with every score. Benchmarks, sector indices, market-cap bands
# and peer overrides are empty until you set them; the engines then say so instead of guessing.
analysis:
  ta:
    sma_windows: [20, 50, 200]
    ema_window: 21
    rsi_period: 14
    atr_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    roc_sessions: [63, 126, 252]
    vol_windows: [20, 60]
    bollinger_window: 20
    bollinger_width_k: 2
    slope_lookback: 20
    year_window: 252
    rs_window: 126
    min_bars_long: 200
    benchmarks: {}              # market -> index symbol, e.g. {IN: "NIFTY 50"}
    sector_index: {}            # sector name -> index symbol
  levels: {pivot_window: 5, cluster_tolerance_pct: 1.5, max_levels: 3, gap_min_pct: 1, max_gap_zones: 3}
  regime: {risk_on_breadth_pct: 60, risk_off_breadth_pct: 40, min_breadth_universe: 20}
  setups:
    pullback_atr_band: 1
    breakout_volume_mult: 1.5
    rsi_trend_min: 50
    rsi_trend_max: 70
    base_lookback: 40
    base_atr_pct_max: 3
    stop_atr_mult: 2
    precedence: [breakout, pullback, trend_continuation, base, downtrend, none]
  fa:
    financial_sectors: [Banks, Financial Services, Finance, NBFC, Insurance]
    default_tax_rate_pct: 25
    growth_years: 3
  valuation:
    history_years: [5, 10]
    min_obs: 24
    min_peers: 3
    dcf:
      horizon_years: 10
      base: {growth_pct: 8, discount_pct: 12, terminal_growth_pct: 3}
      bull: {growth_pct: 12, discount_pct: 11, terminal_growth_pct: 4}
      bear: {growth_pct: 4, discount_pct: 14, terminal_growth_pct: 2}
    peer_overrides: {}          # symbol -> [peer symbols]
  flags:
    pledge_pct: 20
    pledge_rising_quarters: 2
    cfo_to_pat_min: 0.5
    cfo_to_pat_years: 3
    receivable_days_rise_pct: 30
    dilution_pct_per_year: 5
    contingent_pct_of_net_worth: 20
    auditor_lookback_days: 730
    severity:
      pledge_high_and_rising: hard
      pledge_high: soft
      pledge_rising: soft
      auditor_change: soft
      cfo_to_pat: hard
      receivable_days: soft
      dilution: soft
      contingent_liabilities: hard
  xray:
    asset_class_map: {equity: equity, etf: equity, bond: debt}
    mf_category_map: {Equity: equity, Debt: debt, Liquid: debt}
    market_cap: {}              # market -> {large_min: .., mid_min: ..}; empty: unclassified
    top_n: [5, 10]
  risk: {lookback_days: 252, drawdown_years: [1, 3], participation_pct: 10, adv_days: 20, min_overlap_days: 60}
  screen: {max_universe: 5000, max_rules: 50}
  scoring:
    weights_version: pid-15.5-v1
    weights:
      long_term: {quality: 30, value: 25, growth: 25, momentum: 10, risk: 10}
      positional: {quality: 15, value: 10, growth: 20, momentum: 45, risk: 10}
    top_band_min: 75
    upper_band_min: 60
    hold_band_min: 40
    support_floor: 50
    valuation_penalty_over_pct: 90
    valuation_penalty_points: 25
    min_input_pct: 70
    min_peers_for_sector: 5
    flag_penalty_hard: 50
    flag_penalty_soft: 20
    setup_quality: {breakout: 90, pullback: 80, trend_continuation: 70, base: 50, downtrend: 0, none: 30}

# E7 research committee: owner-set parameters, example only and equal to the built-in defaults
# (nothing here is advice). Model ids are SDK aliases, unverified against the live CLI: set exact
# ids. tiers map each agent to top/mid/small (PID 14.1). prompt_pins pins a prompt version.
agents:
  models: {top: opus, mid: sonnet, small: haiku}
  tiers: {fundamental: top, technical: mid, news: mid, macro: mid, mf: mid, bull: top, bear: top, lens: mid, risk: top, pm: top}
  concurrency: 4               # live agents across the whole run, 1..16
  debate_rounds: 2             # deep mode, 1..3
  lenses_enabled: true
  lenses: [value, growth, contrarian, valuation]
  min_coverage_pct: 70         # below this the verdict is INSUFFICIENT_DATA
  prompt_pins: {}              # agent -> version number; unset means the newest
  max_turns: {}                # agent -> turn cap override
  # max_budget_usd: 1.0        # per-agent spend cap (unset: none)
  starter_weight_pct: 2        # weight tested against the profile limits for the risk veto
  # max_days_to_trade: 5       # unset: liquidity does not veto
  max_filing_sections: 2       # filing-text reads per fundamental run
