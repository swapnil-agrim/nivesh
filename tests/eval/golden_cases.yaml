    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-09', '110']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '210']
  expect: {status: pending}
- id: score_entry_uses_price_date_not_the_issue_day_bar
  kind: score_call
  safety: true
  historical: false
  given:
    verdict: BUY
    as_of: '2026-01-05'
    price_date: '2026-01-02'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-02', '100']
    - ['2026-01-05', '150']
    - ['2026-01-12', '120']
    benchmark:
    - ['2026-01-02', '200']
    - ['2026-01-05', '200']
    - ['2026-01-12', '220']
  expect: {ret: '20.0000', benchmark_ret: '10.0000', call_excess: '9.7500', hit: true}
- id: score_stale_end_bar_is_insufficient
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: BUY
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 6
    security:
    - ['2026-01-05', '100']
    - ['2026-01-30', '120']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-30', '210']
  expect: {status: insufficient_data}
- id: scorecard_19_calls_is_not_enough
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: verdict
    key: BUY
    calls:
    - {verdict: BUY, count: 19, excess: '1'}
  expect: {calls: 19, scored: 19, enough: false, hit_pct: '100.00'}
- id: scorecard_20_calls_is_enough
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: verdict
    key: BUY
    calls:
    - {verdict: BUY, count: 20, excess: '1'}
  expect: {calls: 20, enough: true}
- id: scorecard_counts_calls_not_horizon_rows
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: verdict
    key: BUY
    calls:
    - count: 19
      horizons: [1, 4, 13, 26, 52]
      excess: '1'
  expect: {calls: 19, scored: 19, enough: false}
- id: scorecard_one_sign_for_buy_and_sell
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: market
    key: IN
    calls:
    - {verdict: BUY, count: 15, excess: '2'}
    - {verdict: SELL, count: 5, excess: '4'}
    - {verdict: BUY, count: 5, excess: '-6'}
  expect: {calls: 25, scored: 25, hit_pct: '80.00', mean_excess: '0.8000', median_excess: '2.0000', worst: '-6',
    enough: true}
- id: scorecard_hold_counts_but_has_no_hit_or_excess
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: market
    key: IN
    min_bucket: 1
    calls:
    - {verdict: HOLD, count: 3}
    - {verdict: BUY, count: 2, excess: '3'}
  expect: {calls: 5, scored: 5, hit_pct: '100.00', mean_excess: '3.0000'}
- id: scorecard_insufficient_calls_counted_not_scored
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: verdict
    key: INSUFFICIENT_DATA
    calls:
    - {verdict: INSUFFICIENT_DATA, count: 4, status: insufficient_data}
    - {count: 1, excess: '1'}
  expect: {calls: 4, scored: 0, hit_pct: null, enough: false}
- id: scorecard_empty_input_has_no_bucket
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: verdict
    key: BUY
    calls: []
  expect: {found: false}
- id: scorecard_splits_system_and_acted_calls
  kind: scorecard_bucket
  safety: false
  historical: false
  given:
    dimension: system_vs_acted
    key: acted
    min_bucket: 1
    calls:
    - {count: 2, excess: '5', acted: true}
    - {count: 3, excess: '-1'}
  expect: {calls: 2, mean_excess: '5.0000', enough: true}
- id: calibration_39_calls_is_not_enough
  kind: calibration_verdict
  safety: false
  historical: false
  given:
    groups:
      high: [15, 4]
      medium: [10, 10]
  expect: {enough: false, n: 39, verdict: not enough data}
- id: calibration_8_calls_is_not_enough
  kind: calibration_verdict
  safety: false
  historical: false
  given:
    groups:
      high: [5, 3]
  expect: {enough: false, n: 8}
- id: calibration_40_calls_gives_a_report
  kind: calibration_verdict
  safety: false
  historical: false
  given:
    groups:
      high: [20, 0]
      low: [10, 10]
  expect: {enough: true, n: 40, verdict: monotonic}
- id: calibration_falling_hit_rates_are_monotonic
  kind: calibration_verdict
  safety: false
  historical: false
  given:
    groups:
      high: [80, 20]
      medium: [60, 40]
      low: [40, 60]
  expect: {verdict: monotonic}
- id: calibration_rising_hit_rates_are_not_monotonic
  kind: calibration_verdict
  safety: false
  historical: false
  given:
    groups:
      high: [40, 60]
      medium: [60, 40]
      low: [80, 20]
  expect: {verdict: not monotonic}
- id: calibration_overlapping_intervals_are_inconclusive
  kind: calibration_verdict
  safety: false
  historical: false
  given:
    groups:
      high: [8, 6]
      medium: [7, 7]
      low: [6, 8]
  expect: {verdict: inconclusive}
