# Golden set (ST-12.6): model-free cases, each with the properties it must show. Decimals and
# dates are quoted strings so no float enters. A case marked safety guards a PID safety property:
# if one fails, the release is blocked whatever the overall pass rate. No case calls a model.
cases:
- id: score_buy_beats_benchmark
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: BUY
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '112']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '210']
  expect: {status: scored, ret: '12.0000', benchmark_ret: '5.0000', excess: '7.0000', call_excess: '6.7500',
    hit: true, end_date: '2026-01-12'}
- id: score_buy_cost_flips_the_sign
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: BUY
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '105.1']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '210']
  expect: {status: scored, excess: '0.1000', call_excess: '-0.1500', hit: false}
- id: score_accumulate_uses_the_buy_rule
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: ACCUMULATE
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '112']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '210']
  expect: {call_excess: '6.7500', hit: true}
- id: score_sell_hit_when_security_trails
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: SELL
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '97']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '208']
  expect: {ret: '-3.0000', benchmark_ret: '4.0000', call_excess: '7.0000', hit: true}
- id: score_sell_miss_when_security_leads
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: SELL
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '104']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '204']
  expect: {excess: '2.0000', call_excess: '-2.0000', hit: false}
- id: score_trim_uses_the_do_nothing_rule
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: TRIM
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '97']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '208']
  expect: {call_excess: '7.0000', hit: true}
- id: score_hold_is_scored_without_a_hit
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: HOLD
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
