    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '112']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '210']
  expect: {status: scored, excess: '7.0000', call_excess: null, hit: null}
- id: score_insufficient_verdict_is_not_scored
  kind: score_call
  safety: false
  historical: false
  given:
    verdict: INSUFFICIENT_DATA
    as_of: '2026-01-05'
    price_date: '2026-01-05'
    horizon_weeks: 1
    cost_pct: '0.25'
    today: '2027-01-01'
    stale_days: 7
    security:
    - ['2026-01-05', '100']
    - ['2026-01-12', '112']
    benchmark:
    - ['2026-01-05', '200']
    - ['2026-01-12', '210']
  expect: {status: insufficient_data, ret: null}
- id: score_pending_until_both_series_reach_the_target
